# Oh My Posh as the Antigravity CLI statusline (~/.config/oh-my-posh/antigravity.toml)
# Managed by nix-modules (tools.oh-my-posh). Rendered by
# `oh-my-posh antigravity`, which reads Antigravity's statusline JSON on stdin.
# Mirrors claude.toml so every agent's statusline reads the same way.

"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 4

[palette]
  accent = '{{ if .Env.REPO_CONTEXT_COLOR }}{{ .Env.REPO_CONTEXT_COLOR }}{{ else if .Env.REPO_CONTEXT }}#fab387{{ else }}cyan{{ end }}'

# Line one: where the agent is working and what state it is in.
[[blocks]]
  type = "prompt"
  alignment = "left"

  [[blocks.segments]]
    type = "path"
    style = "plain"
    foreground = "p:accent"
    template = "{{ .Path }} "

    [blocks.segments.options]
      style = "agnoster_short"
      max_depth = 3
      home_icon = "~"
      folder_separator_icon = "/"

  [[blocks.segments]]
    type = "git"
    style = "plain"
    foreground = "magenta"
    template = '{{ .HEAD }}{{ if .IsWorkTree }}<p:accent> ⎇</>{{ end }}{{ if or .Working.Changed .Staging.Changed }} <p:accent>●</>{{ end }} '

  # The payload also carries the signed-in email; it is left out on purpose.
  [[blocks.segments]]
    type = "antigravity"
    style = "plain"
    foreground = "#8ab4f8"
    template = '<darkGray>│</> {{ .Model.DisplayName }}{{ if .ExecutionMode }} <darkGray>{{ .ExecutionMode }}</>{{ end }}{{ if .Sandbox }}{{ if .Sandbox.Enabled }} 🛡{{ end }}{{ end }} <darkGray>│</> <{{ if ge (atoi .TokenUsagePercent.String) 80 }}red{{ else }}p:accent{{ end }}>{{ .TokenGaugeUsed }} {{ .TokenUsagePercent }}%</> {{ if ne .FormattedTokens "0" }}<darkGray>{{ .FormattedTokens }}</>{{ end }}{{ if .ToolConfirmationPending }} <yellow>⏸ confirm</>{{ end }}{{ if gt .PendingInputCount 0 }} <yellow>✉ {{ .PendingInputCount }}</>{{ end }}{{ if gt .TaskCount 0 }} <darkGray>☰ {{ .TaskCount }}</>{{ end }}'

    [blocks.segments.options]
      gauge_marked_char = "▰"
      gauge_unmarked_char = "▱"

# Line two: plan quota and last-turn cache hit ratio, shown when Antigravity sends them.
[[blocks]]
  type = "prompt"
  alignment = "left"
  newline = true

  [[blocks.segments]]
    type = "antigravity"
    style = "plain"
    foreground = "darkGray"
    template = '''
{{- $g5 := index .Quota "gemini-5h" -}}
{{- $gw := index .Quota "gemini-weekly" -}}
{{- $t5 := index .Quota "3p-5h" -}}
{{- $tw := index .Quota "3p-weekly" -}}
{{- $hasG5 := or $g5.RemainingFraction $g5.ResetTime -}}
{{- $hasGW := or $gw.RemainingFraction $gw.ResetTime -}}
{{- $hasT5 := or $t5.RemainingFraction $t5.ResetTime -}}
{{- $hasTW := or $tw.RemainingFraction $tw.ResetTime -}}
{{- $hasG := or $hasG5 $hasGW -}}
{{- $hasT := or $hasT5 $hasTW -}}
{{- $hasQuota := gt (len .Quota) 0 -}}
{{- if $hasG -}}
  <#8ab4f8>gemini</>
  {{- if $hasG5 }}{{ with $g5.RemainingFraction }}{{ $p := mulf . 100 }} 5h <{{ if le $p 20.0 }}red{{ else if le $p 50.0 }}yellow{{ else }}green{{ end }}>{{ printf "%.0f" $p }}%</>{{ end }}{{ with $g5.ResetTime }} ↻{{ toDate "2006-01-02T15:04:05Z07:00" . | date "15:04" }}{{ end }}{{ end -}}
  {{- if and $hasG5 $hasGW }} ·{{ end -}}
  {{- if $hasGW }}{{ with $gw.RemainingFraction }}{{ $p := mulf . 100 }} 7d <{{ if le $p 20.0 }}red{{ else if le $p 50.0 }}yellow{{ else }}green{{ end }}>{{ printf "%.0f" $p }}%</>{{ end }}{{ with $gw.ResetTime }} ↻{{ toDate "2006-01-02T15:04:05Z07:00" . | date "Mon 15:04" }}{{ end }}{{ end -}}
{{- end -}}
{{- if and $hasG $hasT }} │ {{ end -}}
{{- if $hasT -}}
  <#d97757>3p</>
  {{- if $hasT5 }}{{ with $t5.RemainingFraction }}{{ $p := mulf . 100 }} 5h <{{ if le $p 20.0 }}red{{ else if le $p 50.0 }}yellow{{ else }}green{{ end }}>{{ printf "%.0f" $p }}%</>{{ end }}{{ with $t5.ResetTime }} ↻{{ toDate "2006-01-02T15:04:05Z07:00" . | date "15:04" }}{{ end }}{{ end -}}
  {{- if and $hasT5 $hasTW }} ·{{ end -}}
  {{- if $hasTW }}{{ with $tw.RemainingFraction }}{{ $p := mulf . 100 }} 7d <{{ if le $p 20.0 }}red{{ else if le $p 50.0 }}yellow{{ else }}green{{ end }}>{{ printf "%.0f" $p }}%</>{{ end }}{{ with $tw.ResetTime }} ↻{{ toDate "2006-01-02T15:04:05Z07:00" . | date "Mon 15:04" }}{{ end }}{{ end -}}
{{- end -}}
{{- range $id, $q := .Quota -}}
  {{- if and (ne $id "gemini-5h") (ne $id "gemini-weekly") (ne $id "3p-5h") (ne $id "3p-weekly") -}}
    {{- if or $hasG $hasT }} │ {{ end -}}
    {{ $id }}{{ with $q.RemainingFraction }}{{ $p := mulf . 100 }} <{{ if le $p 20.0 }}red{{ else if le $p 50.0 }}yellow{{ else }}green{{ end }}>{{ printf "%.0f" $p }}%</>{{ end }}{{ with $q.ResetTime }} ↻{{ toDate "2006-01-02T15:04:05Z07:00" . | date "15:04" }}{{ end }}
  {{- end -}}
{{- end -}}
{{- with .ContextWindow.CurrentUsage -}}
  {{- $tot := add .InputTokens .CacheCreationInputTokens .CacheReadInputTokens -}}
  {{- if gt $tot 0 -}}
    {{- $hit := div (mul .CacheReadInputTokens 100) $tot -}}
    {{- if $hasQuota }} │ {{ end -}}
    cache <{{ if lt $hit 30 }}red{{ else if lt $hit 70 }}yellow{{ else }}green{{ end }}>{{ $hit }}%</>
  {{- end -}}
{{- end -}}'''
