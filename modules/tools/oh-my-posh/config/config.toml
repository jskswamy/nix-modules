# Oh My Posh configuration (~/.config/oh-my-posh/config.toml)
# Managed by nix-modules (tools.oh-my-posh).
#
# Two lines: context on the first, a bare ❯ on the second, toolchain in
# fish's right prompt. Plain text, with rounded pills reserved for alerts
# (client repo, prod contexts, failed command).

"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 4
final_space = true
# Full repo and branch live in the title so the prompt can abbreviate them.
# The Rex session label (POSH_REX) leads when it names something else.
console_title_template = '{{ $rex := .Env.POSH_REX }}{{ if .Root }}⚡ {{ end }}{{ if .Segments.Contains "Git" }}{{ if and $rex (not (contains .Segments.Git.RepoName $rex)) }}{{ $rex }} ▸ {{ end }}{{ .Segments.Git.RepoName }} · {{ .Segments.Git.Ref }}{{ else }}{{ if $rex }}{{ $rex }} ▸ {{ end }}{{ .Folder }}{{ end }}'
shell_integration = true
streaming = 50
tooltips_action = "replace"

# Repo contexts (REPO_CONTEXT*, exported by tools.fish's repo-context hook
# from tools.fish.repoContext) colour the pill and swap the accent.
[palette]
  context = '{{ if .Env.REPO_CONTEXT_COLOR }}{{ .Env.REPO_CONTEXT_COLOR }}{{ else }}#fab387{{ end }}'
  accent = '{{ if .Env.REPO_CONTEXT }}p:context{{ else }}cyan{{ end }}'
  ok = '{{ if .Env.REPO_CONTEXT }}p:context{{ else }}green{{ end }}'

[transient_prompt]
  background = "transparent"
  foreground_templates = [
    "{{ if gt .Code 0 }}red{{ end }}",
    "{{ if eq .Code 0 }}p:ok{{ end }}",
  ]
  template = '<darkGray>{{ now | date "15:04" }}</> ❯ '

[secondary_prompt]
  background = "transparent"
  foreground = "darkGray"
  template = "❯ "

# ---------------------------------------------------------------------------
# Line one: where am I, and what is risky about it
# ---------------------------------------------------------------------------
[[blocks]]
  type = "prompt"
  alignment = "left"

  [[blocks.segments]]
    type = "session"
    style = "plain"
    foreground = "yellow"
    template = '{{ if .SSHSession }}{{ .UserName }}@{{ .HostName }} {{ end }}'

  [[blocks.segments]]
    type = "text"
    style = "diamond"
    leading_diamond = ""
    trailing_diamond = " "
    foreground = "#1e1e2e"
    background = "p:context"
    template = '{{ if .Env.REPO_CONTEXT }}{{ with .Env.REPO_CONTEXT_ICON }}{{ . }} {{ end }}{{ .Env.REPO_CONTEXT }}{{ end }}'

  # aide exports AIDE_SANDBOX/AIDE_PROFILE into the shells it launches.
  [[blocks.segments]]
    type = "text"
    style = "plain"
    foreground = "lightYellow"
    template = '{{ if eq .Env.AIDE_SANDBOX "on" }}🛡 {{ .Env.AIDE_PROFILE }} {{ end }}'

  # Production cloud contexts stay on screen; everything else is a tooltip.
  [[blocks.segments]]
    type = "kubectl"
    style = "diamond"
    leading_diamond = ""
    trailing_diamond = " "
    foreground = "#1e1e2e"
    background = "#f38ba8"
    template = '{{ if regexMatch "(?i)prod" .Context }}k8s {{ .Context }}{{ if .Namespace }}/{{ .Namespace }}{{ end }}{{ end }}'

    [blocks.segments.options]
      parse_kubeconfig = true

  [[blocks.segments]]
    type = "aws"
    style = "diamond"
    leading_diamond = ""
    trailing_diamond = " "
    foreground = "#1e1e2e"
    background = "#f38ba8"
    template = '{{ if regexMatch "(?i)prod" .Profile }}aws {{ .Profile }}{{ end }}'

  # In a jj repo this replaces the git segment (gated on it below).
  [[blocks.segments]]
    type = "jujutsu"
    style = "plain"
    foreground = "magenta"
    template = '<p:accent>at </><darkGray>{{ .Folder }}</>{{ if .ClosestBookmarks }} {{ .ClosestBookmarks }}{{ end }} {{ .ChangeIDPrefix }}<darkGray>{{ .ChangeIDRest }}</>{{ if .Working.Changed }} <p:accent>[{{ .Working.String }}]</>{{ end }} '

    # 30.9 still needs fetch_status; newer releases fetch from the template.
    [blocks.segments.options]
      fetch_status = true
      change_id_min_len = 4

  [[blocks.segments]]
    type = "git"
    style = "plain"
    foreground = "magenta"
    template = '{{ if not (.Segments.Contains "Jujutsu") }}<p:accent>at </><darkGray>{{ .RepoName }}</>{{ if .IsWorkTree }}<p:accent> ⎇</>{{ else if gt .WorktreeCount 0 }}<darkGray> ⎇{{ .WorktreeCount }}</>{{ end }}{{ if .RelativeDir }}<p:accent>/{{ .RelativeDir }}</>{{ end }} {{ .HEAD }}{{ if or .Working.Changed .Staging.Changed (gt .Ahead 0) (gt .Behind 0) (gt .StashCount 0) }} <p:accent>[{{ if .Staging.Changed }}<green>++({{ add .Staging.Added .Staging.Modified .Staging.Deleted }})</>{{ end }}{{ if .Working.Changed }}{{ end }}{{ if gt .StashCount 0 }}{{ end }}{{ if gt .Ahead 0 }}⇡{{ .Ahead }}{{ end }}{{ if gt .Behind 0 }}⇣{{ .Behind }}{{ end }}]</>{{ end }}{{ if .Merge }} <red>MERGING</>{{ end }}{{ if .Rebase }} <red>REBASING</>{{ end }}{{ if .CherryPick }} <red>CHERRY-PICK</>{{ end }} {{ end }}'

    [blocks.segments.options]
      fetch_status = true
      fetch_upstream_icon = false
      # Known `<type>/` prefixes become an icon, then `<type>/<id>-<description>`
      # shows as `<type>/<id>` (or `<icon> <id>`); anything else is cut at 30.
      branch_template = '{{ $b := .Branch }}{{ $i := "" }}{{ range $re, $g := dict "^(feature|feat)/" "✨" "^(fix|bugfix)/" "🩹" "^hotfix/" "🔥" "^release/" "🚀" "^chore/" "🧹" "^(renovate|dependabot|claude)/" "🤖" }}{{ if regexMatch $re $b }}{{ $i = $g }}{{ end }}{{ end }}{{ if $i }}{{ $b = printf "%s %s" $i (regexReplaceAll "^[^/]+/" $b "") }}{{ end }}{{ $id := regexFind "^([^ ]+ |[^/]+/)([A-Za-z]+-)?[0-9]+" $b }}{{ if $id }}{{ $id }}{{ else if gt (len $b) 30 }}{{ trunc 29 $b }}…{{ else }}{{ $b }}{{ end }}'

  [[blocks.segments]]
    type = "path"
    style = "plain"
    foreground = "p:accent"
    template = '{{ if not (or (.Segments.Contains "Git") (.Segments.Contains "Jujutsu")) }}at {{ .Path }}{{ if not .Writable }} {{ end }} {{ end }}'

    [blocks.segments.options]
      style = "agnoster_short"
      max_depth = 3
      home_icon = "~"
      folder_separator_icon = "/"

  [[blocks.segments]]
    type = "nix-shell"
    style = "plain"
    foreground = "blue"
    template = "🐧 "

  [[blocks.segments]]
    type = "text"
    style = "plain"
    foreground = "green"
    template = "{{ if .Env.DIRENV_DIR }} {{ end }}"

  [[blocks.segments]]
    type = "executiontime"
    style = "plain"
    foreground = "yellow"
    template = " {{ .FormattedMs }} "

    [blocks.segments.options]
      threshold = 2000
      style = "roundrock"

  # `reason` names the failure (SIGINT, SIGKILL, ...) instead of a bare code.
  [[blocks.segments]]
    type = "status"
    style = "diamond"
    leading_diamond = ""
    trailing_diamond = " "
    foreground = "#1e1e2e"
    background = "#f38ba8"
    template = "{{ if .Executed }}{{ reason .Code }}{{ end }}"

# ---------------------------------------------------------------------------
# Line two: the prompt character
# ---------------------------------------------------------------------------
[[blocks]]
  type = "prompt"
  alignment = "left"
  newline = true

  [[blocks.segments]]
    type = "text"
    style = "plain"
    foreground_templates = [
      "{{ if gt .Code 0 }}red{{ end }}",
      "{{ if eq .Code 0 }}p:ok{{ end }}",
    ]
    template = "❯"

# ---------------------------------------------------------------------------
# Right prompt: toolchain and low battery. Fish places it itself, so it
# follows resizes; the guard in oh-my-posh.fish hides it under 100 cols while
# still letting command tooltips render.
# ---------------------------------------------------------------------------
[[blocks]]
  type = "rprompt"

  [[blocks.segments]]
    type = "text"
    style = "plain"
    foreground = "blue"
    template = '{{ if .Env.POSH_NIX_FLAKE }} ❄{{ if .Env.POSH_FLAKE_AGE }} <yellow>{{ .Env.POSH_FLAKE_AGE }}d</>{{ end }}{{ end }}'

  [[blocks.segments]]
    type = "project"
    style = "plain"
    foreground = "darkGray"
    template = '{{ if .Name }}  {{ .Name }}{{ if .Version }}@{{ .Version }}{{ end }}{{ end }}'

    [blocks.segments.cache]
      duration = "1m"
      strategy = "folder"

  [[blocks.segments]]
    type = "go"
    style = "plain"
    foreground = "cyan"
    template = "  {{ .Full }}"

    [blocks.segments.cache]
      duration = "1m"
      strategy = "folder"

  [[blocks.segments]]
    type = "node"
    style = "plain"
    foreground = "green"
    template = "  {{ .Full }}"

    [blocks.segments.cache]
      duration = "1m"
      strategy = "folder"

  [[blocks.segments]]
    type = "bun"
    style = "plain"
    foreground = "red"
    template = "  {{ .Full }}"

    [blocks.segments.cache]
      duration = "1m"
      strategy = "folder"

  [[blocks.segments]]
    type = "deno"
    style = "plain"
    foreground = "green"
    template = "  {{ .Full }}"

    [blocks.segments.cache]
      duration = "1m"
      strategy = "folder"

  [[blocks.segments]]
    type = "ruby"
    style = "plain"
    foreground = "red"
    template = "  {{ .Full }}"

    [blocks.segments.cache]
      duration = "1m"
      strategy = "folder"

  [[blocks.segments]]
    type = "rust"
    style = "plain"
    foreground = "red"
    template = "  {{ .Full }}"

    [blocks.segments.cache]
      duration = "1m"
      strategy = "folder"

  [[blocks.segments]]
    type = "java"
    style = "plain"
    foreground = "red"
    template = "  {{ .Full }}"

    [blocks.segments.cache]
      duration = "1m"
      strategy = "folder"

  [[blocks.segments]]
    type = "time"
    style = "plain"
    foreground = "darkGray"
    template = " {{ .CurrentDate | date .Format }}"

    [blocks.segments.options]
      time_format = "15:04"

  [[blocks.segments]]
    type = "battery"
    style = "plain"
    foreground = "red"
    template = "{{ if le .Percentage 10 }} {{ .Percentage }}% {{ end }}"

    [blocks.segments.cache]
      duration = "2m"
      strategy = "device"

# ---------------------------------------------------------------------------
# Tooltips (render on the right while typing matching commands — even on
# narrow panes)
# ---------------------------------------------------------------------------
[[tooltips]]
  type = "text"
  style = "plain"
  foreground = "cyan"
  tips = ["aide"]
  template = "{{ if .Env.POSH_AIDE }}{{ .Env.POSH_AIDE }}{{ end }}"

[[tooltips]]
  type = "text"
  style = "plain"
  foreground = "magenta"
  tips = ["bd"]
  template = "{{ if .Env.POSH_BEADS }}◈ {{ .Env.POSH_BEADS }}{{ end }}"

[[tooltips]]
  type = "text"
  style = "plain"
  foreground = "blue"
  tips = ["nix", "nh", "darwin-rebuild", "nixos-rebuild"]
  template = "{{ if or .Env.IN_NIX_SHELL .Env.POSH_NIX_FLAKE }}❄ {{ if .Env.IN_NIX_SHELL }}shell:{{ .Env.IN_NIX_SHELL }}{{ end }}{{ if and .Env.IN_NIX_SHELL .Env.POSH_NIX_FLAKE }} · {{ end }}{{ if .Env.POSH_NIX_FLAKE }}flake{{ end }}{{ end }}"

[[tooltips]]
  type = "text"
  style = "plain"
  foreground = "green"
  tips = ["direnv"]
  template = " {{ if .Env.DIRENV_DIR }}active ({{ .Env.DIRENV_DIR }}){{ else }}inactive{{ end }}"

[[tooltips]]
  type = "text"
  style = "plain"
  foreground = "magenta"
  tips = ["devbox"]
  template = " devbox {{ if .Env.POSH_DEVBOX }}{{ .Env.POSH_DEVBOX }}{{ else }}idle{{ end }}"

[[tooltips]]
  type = "aws"
  style = "plain"
  foreground = "yellow"
  tips = ["aws"]
  template = " {{ .Profile }}{{ if .Region }} {{ .RegionAlias }}{{ end }}"

  [tooltips.options]
    display_default = true

    [tooltips.options.region_aliases]
      ap-south-1 = "mumbai"
      us-east-1 = "virginia"
      us-west-2 = "oregon"

[[tooltips]]
  type = "gcp"
  style = "plain"
  foreground = "yellow"
  tips = ["gcloud", "gsutil"]
  template = " {{ .Project }}{{ if .Account }} ({{ .Account }}){{ end }}"

[[tooltips]]
  type = "terraform"
  style = "plain"
  foreground = "magenta"
  tips = ["terraform", "tf"]
  template = " {{ .WorkspaceName }}{{ if .Version }} {{ .Version }}{{ end }}"

  [tooltips.options]
    fetch_version = true

[[tooltips]]
  type = "kubectl"
  style = "plain"
  foreground = "green"
  tips = ["kubectl", "k", "helm", "k9s", "kubectx", "kustomize", "stern"]
  template = "⛵ {{ .Context }}{{ if .Namespace }} ({{ .Namespace }}){{ end }}"

  [tooltips.options]
    parse_kubeconfig = true

    [tooltips.options.context_aliases]
      "dev.local.cluster.k8s" = "dev"

[[tooltips]]
  type = "docker"
  style = "plain"
  foreground = "blue"
  tips = ["docker", "docker-compose", "lazydocker", "colima"]
  template = " {{ .Context }}"

[[tooltips]]
  type = "python"
  style = "plain"
  foreground = "yellow"
  tips = ["uv", "python", "python3", "pytest"]
  template = " {{ if .Venv }}({{ .Venv }}) {{ end }}{{ .Full }}"

  [tooltips.options]
    fetch_virtual_env = true
    display_mode = "always"
