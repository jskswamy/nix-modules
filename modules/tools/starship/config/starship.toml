add_newline = false
command_timeout = 5000
format = "$env_var$directory$git_branch$git_status$nix_shell$direnv$cmd_duration$jobs$status$character"
right_format = "$custom$golang$nodejs$bun$deno$ruby$rust$java$package$aws$gcloud$terraform$docker_context$kubernetes"
scan_timeout = 30

[aws]
disabled = false
format = "on [$symbol($profile )($region )]($style) "
style = "bold yellow"
symbol = " "

[aws.region_aliases]
ap-south-1 = "mumbai"
us-east-1 = "virginia"
us-west-2 = "oregon"

[battery]
charging_symbol = ""
disabled = false
discharging_symbol = ""
full_symbol = ""

[[battery.display]]
style = "bold red"
threshold = 10

[bun]
format = "via [$symbol($version )]($style) "
symbol = " "
style = "bold red"

[character]
error_symbol = "[❯](bold red)"
success_symbol = "[❯](bold green)"
vicmd_symbol = "[❮](bold yellow)"

[cmd_duration]
format = " [$duration](bold yellow) "
min_time = 2000
style = "yellow"

[conda]
disabled = true
symbol = " "

[deno]
format = "via [$symbol($version )]($style) "
symbol = " "
style = "green"

[directory]
format = "at [$path]($style)[$read_only]($read_only_style) "
home_symbol = " ~"
read_only = "  "
read_only_style = "197"
truncation_length = 3
truncation_symbol = "…/"

[docker_context]
detect_extensions = []
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_folders = []
format = "via [$symbol $context](blue bold) "
symbol = ""

[gcloud]
disabled = true
format = "on [$symbol$account(\\($project\\))]($style) "
style = "bold yellow"
symbol = " "

[gcloud.region_aliases]
asia-northeast1 = "an1"

[git_branch]
symbol = " "

[git_state]
cherry_pick = "🍒 PICKING"
disabled = true
progress_divider = " of "

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
conflicted = ""
deleted = ""
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
modified = ""
renamed = ""
staged = "[++\\($count\\)](green)"
stashed = ""
style = "cyan"
untracked = "ﬔ"
up_to_date = ""

[golang]
symbol = " "

[hg_branch]
disabled = true
symbol = " "

[java]
disabled = false
symbol = " "

[jobs]
format = "[$symbol$number]($style) "
number_threshold = 2
symbol_threshold = 1
threshold = 1

[kubernetes]
detect_env_vars = ["KUBECTL_CONTEXT", "KUBECONFIG"]
detect_extensions = []
detect_files = ["k8s", ".kube"]
detect_folders = ["k8s", ".kube", "kubernetes"]
disabled = true
format = "on [⛵ ($user on )($cluster in )$context ($namespace)](dimmed green) "

[kubernetes.context_aliases]
"dev.local.cluster.k8s" = "dev"

[memory_usage]
disabled = true
symbol = " "

[nix_shell]
disabled = false
format = "[$symbol](bold blue) "
impure_msg = ""
pure_msg = ""
symbol = "🐧"

[nodejs]
disabled = false
symbol = " "

[package]
disabled = false
symbol = " "

[php]
disabled = true
symbol = " "

[python]
disabled = true
symbol = " "

[ruby]
symbol = " "

[rust]
symbol = " "

[status]
disabled = false
format = "[$symbol]($style)"
map_symbol = true
style = "red"
symbol = "🔴 "

[terraform]
detect_extensions = ["tf", "tfplan", "tfstate"]
detect_files = ["terraform.tfvars", ".terraform.lock.hcl"]
detect_folders = [".terraform"]
disabled = false
format = "via [$symbol $version$workspace]($style) "
symbol = ""

[time]
disabled = true

[username]
disabled = true

[direnv]
disabled = false
format = "([ $allowed]($style))"
symbol = ""
style = "dimmed green"
loaded_msg = ""
unloaded_msg = ""
allowed_msg = ""
not_allowed_msg = " "
denied_msg = " "

[custom.aide]
command = "aide prompt --compact"
when = "true"
symbol = ""
format = "[ $output ]($style) "
style = "bold cyan"

[custom.nix_flake]
description = "Show ❄ when a flake.nix is present in the cwd"
detect_files = ["flake.nix"]
symbol = "❄ "
format = "[$symbol]($style)"
style = "bold blue"
when = "true"

[env_var]
variable = "REPO_CONTEXT"
format = "[🔰]($style) "
style = "bold yellow"
