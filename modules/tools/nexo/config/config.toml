# nexo configuration (~/.config/nexo/config.toml)
# Managed by nix-modules (tools.nexo).

paths = [
  "~/source/github.com/*",
]
git-from-home = true

# Name containers from the remote (org/team/repo); a missing team and its
# separator drop out, giving org/repo. Needs the session-naming fork build.
[session]
name-template = "{org}/{team}/{repo}"

# Extra keys on a Projects row: open the project beside the current pane
# instead of in its own session. Backends without a behavior hide its key.
[[tui.project-actions]]
key = "ctrl+s"
behavior = "split-right"
label = "split"

[[tui.project-actions]]
key = "alt+w"
behavior = "float"

[[tui.project-actions]]
key = "alt+t"
behavior = "tab"
