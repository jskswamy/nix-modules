---
# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# AgentGateway MCP proxy config.
# Symlinked to ~/.config/agentgateway/config.yaml via files.nix for instant
# edits.
# ${THINGS_CLOUD_AUTH} is expanded from the process environment at load time
# (agentgateway runs the whole file through shellexpand before parsing) —
# set by the launchd wrapper script in default.nix.
#
# Handles only the HTTP-native things-cloud server, run as a persistent
# daemon (see default.nix); agentgateway just proxies.
gateways:
  default:
    port: 3050
mcp:
  gateways:
    - default
  targets:
    - name: things-cloud
      mcp:
        host: "http://127.0.0.1:8080/mcp"
  policies:
    requestHeaderModifier:
      add:
        Authorization: "Basic ${THINGS_CLOUD_AUTH}"
